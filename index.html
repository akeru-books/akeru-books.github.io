<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陽 アケル 読者ページ</title>
<style>
  :root { --text:#1a1a1a; --sub:#555; --bg:#fff; --link:#0645ad; }
  @media (prefers-color-scheme: dark) { :root { --text:#eee; --sub:#bbb; --bg:#161616; --link:#8ab4f8; } }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif; font-size:19px; line-height:1.8; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.4em; } a { color:var(--link); } li { margin:.6em 0; }
  .sub { color:var(--sub); font-size:.9em; }
</style>
</head>
<body>
<main>
  <h1>陽 アケル 読者ページ</h1>
  <p>陽 アケルの本を読んでくださった方のためのページです。本の発行後に変わった制度や、最新のリンク、訂正をお知らせします。</p>
  <ul>
    <li><a href="furusato/">50代会社員が調べた ふるさと納税の手引書</a><br><span class="sub">ポイントがなくなった今、会社員が自分で上限額を調べ、寄付し、ワンストップ特例で手続きを終え、翌年に差し引かれたかを確かめるまでの手引書。スマートフォンが苦手な方向けの紙と郵便の手順つき。</span></li>
  <li><a href="sukima/">あなたのスキマ時間タイプ診断</a><br><span class="sub">5つの質問に答えると、自分に合った「1日15分」の使い方がわかります。</span></li>
  </ul>
  <p class="sub">本とこのページの作成には、AI(Claude)を使っています。</p>
</main>
</body>
</html>
